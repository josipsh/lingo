[project]
name = "lingo"
version = "0.1.0"
description = "Realtime speech-to-text WebSocket prototype"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi~=0.141.1",
    "uvicorn~=0.53.0",
    "websockets~=16.1.1",
]

[project.scripts]
lingo-server = "lingo.main:run"
lingo-transcribe = "lingo.cli:main"

[dependency-groups]
dev = [
    "httpx~=0.28.1",
    "pytest~=9.1.1",
    "pytest-asyncio~=1.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lingo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
