[project]
name = "lingo"
version = "0.1.0"
description = "WhatsApp voice bot with ElevenLabs STT/TTS and OpenAI LLM"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pipecat-ai[silero,webrtc,openai,elevenlabs]>=1.8.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-dotenv>=1.0.1",
    "aiohttp>=3.10.0",
    "openai>=1.50.0",
]

[project.scripts]
lingo = "lingo.server:main"
lingo-cli = "lingo.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lingo"]

[dependency-groups]
dev = [
    "ruff>=0.12.0",
]

[tool.vercel]
entrypoint = "src.lingo.server:app"

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
